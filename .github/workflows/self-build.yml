name: Self Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true
        type: string
      target:
        description: "Build target"
        required: true
        type: choice
        default: All
        options:
          - All
          - Linux
          - Linux-Naive
          - Linux-Desktop
          - Android
          - macOS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux amd64
    if: inputs.target == 'All' || inputs.target == 'Linux'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Set version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
      - name: Set build variables
        run: |
          set -euo pipefail
          VERSION=$(go run ./cmd/internal/read_tag --nightly)
          test "${VERSION}" != "unknown"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
          tar -C dist -czf dist/sing-box-linux-amd64.tar.gz sing-box
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-linux-amd64
          path: dist/sing-box-linux-amd64.tar.gz
          retention-days: 3

  linux_naive:
    name: Build Linux amd64 with naive outbound
    if: inputs.target == 'All' || inputs.target == 'Linux-Naive'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Set version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
      - name: Set build variables
        run: |
          set -euo pipefail
          VERSION=$(go run ./cmd/internal/read_tag --nightly)
          test "${VERSION}" != "unknown"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS),with_purego" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
      - name: Fetch libcronet.so
        run: |
          set -euo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          LIBRARY_PATH="lib/linux_amd64/libcronet.so"
          git init "${RUNNER_TEMP}/cronet-go-lib"
          git -C "${RUNNER_TEMP}/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "${RUNNER_TEMP}/cronet-go-lib" sparse-checkout set --no-cone "/${LIBRARY_PATH}"
          git -C "${RUNNER_TEMP}/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "${CRONET_GO_VERSION}"
          git -C "${RUNNER_TEMP}/cronet-go-lib" checkout FETCH_HEAD
          cp "${RUNNER_TEMP}/cronet-go-lib/${LIBRARY_PATH}" dist/
      - name: Archive
        run: |
          set -euo pipefail
          tar -C dist -czf dist/sing-box-linux-amd64-naive.tar.gz sing-box libcronet.so
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-linux-amd64-naive
          path: dist/sing-box-linux-amd64-naive.tar.gz
          retention-days: 3

  darwin_arm64:
    name: Build macOS arm64
    if: inputs.target == 'All' || inputs.target == 'macOS'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Set version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
      - name: Set build variables
        run: |
          set -euo pipefail
          VERSION=$(go run ./cmd/internal/read_tag --nightly)
          test "${VERSION}" != "unknown"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS)" >> "${GITHUB_ENV}"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist/sing-box-darwin-arm64
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -v -trimpath \
            -o dist/sing-box-darwin-arm64/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
          cp LICENSE dist/sing-box-darwin-arm64/
          tar -C dist -czf dist/sing-box-darwin-arm64.tar.gz sing-box-darwin-arm64
          rm -rf dist/sing-box-darwin-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-darwin-arm64
          path: dist/sing-box-darwin-arm64.tar.gz
          retention-days: 3

  linux_desktop:
    name: Build Linux desktop x64 with naive outbound
    if: inputs.target == 'All' || inputs.target == 'Linux-Desktop'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Checkout desktop client
        run: |
          set -euo pipefail
          git submodule update --init clients/desktop
          git -C clients/desktop fetch --depth=1 origin dev
          git -C clients/desktop checkout -B dev FETCH_HEAD
          git -C clients/desktop submodule update --init --recursive
      - name: Set version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-desktop-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-desktop-linux-
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/desktop/package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: clients/desktop/package.json
          cache: pnpm
          cache-dependency-path: |
            clients/desktop/pnpm-lock.yaml
            clients/desktop/dashboard/pnpm-lock.yaml
      - name: Set build variables
        run: |
          set -euo pipefail
          VERSION=$(go run ./cmd/internal/read_tag --nightly)
          test "${VERSION}" != "unknown"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Update desktop version
        run: go run -v ./cmd/internal/update_desktop_version --ci --nightly
      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init "${RUNNER_TEMP}/cronet-go"
          git -C "${RUNNER_TEMP}/cronet-go" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "${RUNNER_TEMP}/cronet-go" fetch --depth=1 origin "${CRONET_GO_VERSION}"
          git -C "${RUNNER_TEMP}/cronet-go" checkout FETCH_HEAD
          git -C "${RUNNER_TEMP}/cronet-go" submodule update --init --recursive --depth=1
      - name: Regenerate Debian keyring
        run: |
          set -xeuo pipefail
          rm -f "${RUNNER_TEMP}/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "${RUNNER_TEMP}/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Download Chromium toolchain
        run: |
          set -xeuo pipefail
          cd "${RUNNER_TEMP}/cronet-go"
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain
      - name: Set Chromium toolchain environment
        run: |
          set -xeuo pipefail
          cd "${RUNNER_TEMP}/cronet-go"
          go run ./cmd/build-naive --target=linux/amd64 env >> "${GITHUB_ENV}"
      - name: Install package tools
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y libarchive-tools rpm zstd
          echo '%_rpmformat 4' > "${HOME}/.rpmmacros"
      - name: Install desktop dependencies
        run: pnpm -C clients/desktop install
      - name: Build desktop packages
        run: pnpm -C clients/desktop package:linux -- deb rpm pacman x64
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(clients/desktop/release/SFL-*.deb clients/desktop/release/SFL-*.rpm clients/desktop/release/SFL-*.pkg.tar.zst)
          if (( ${#artifacts[@]} != 3 )); then
            echo "expected 3 Linux desktop packages, found ${#artifacts[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "${artifacts[@]}" dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-linux-desktop-x64
          path: dist
          retention-days: 3

  android:
    name: Build Android arm64 debug APK
    if: inputs.target == 'All' || inputs.target == 'Android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Checkout Android client
        run: git submodule update --init clients/android
      - name: Set version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Build libbox
        run: |
          set -euo pipefail
          make lib_install
          export PATH="${PATH}:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -debug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Checkout Android dev branch
        run: |
          set -euo pipefail
          cd clients/android
          git fetch --depth=1 origin dev
          git checkout -B dev FETCH_HEAD
      - name: Checkout Android submodules
        run: |
          set -euo pipefail
          cd clients/android
          git submodule update --init --recursive -v
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
      - name: Update Android version
        run: go run -v ./cmd/internal/update_android_version --ci --nightly
      - name: Prepare Android signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_PROPERTIES_BASE64: ${{ secrets.ANDROID_RELEASE_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_RELEASE_KEYSTORE_BASE64}"
          test -n "${ANDROID_RELEASE_PROPERTIES_BASE64}"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 -d > clients/android/app/release.keystore
          printf '%s' "${ANDROID_RELEASE_PROPERTIES_BASE64}" | base64 -d > clients/android/local.properties
          chmod 600 clients/android/app/release.keystore clients/android/local.properties
      - name: Build APK
        run: |
          set -euo pipefail
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
          cd clients/android
          ./gradlew --build-cache --parallel :app:assembleOtherDebug
      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp clients/android/app/build/outputs/apk/other/debug/*arm64-v8a*.apk dist/android/sing-box-android-arm64-v8a-debug.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-android-arm64-debug-apk
          path: dist/android/sing-box-android-arm64-v8a-debug.apk
          retention-days: 3

  release:
    name: Release
    needs: [linux, linux_naive, darwin_arm64, linux_desktop, android]
    if: github.ref_name == 'simpletls' && !cancelled() && (needs.linux.result == 'success' || needs.linux_naive.result == 'success' || needs.darwin_arm64.result == 'success' || needs.linux_desktop.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: 'dist/**'
      - name: Delete previous release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view self-latest > /dev/null 2>&1; then
            exit 0
          fi
          gh release view self-latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            gh release delete-asset self-latest "${asset}" --yes
          done
      - name: Move release tag
        run: |
          set -euo pipefail
          git tag -f self-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/self-latest
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: self-latest
          name: Self Build
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Version: ${{ inputs.version }}
            - Build: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: dist/*
